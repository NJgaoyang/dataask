.chart-plot{width:100%;min-width:0;background:#fcfdff;border:1px solid #e7eefb;border-radius:13px;padding:8px 4px 11px;overflow:hidden}
.chart-svg{display:block;width:100%;height:auto;max-width:100%;overflow:visible}
.chart-footnote{margin:5px 10px 0;color:#8496b0;font-size:10px;line-height:1.5}
.mobile-chart-types{display:flex;align-items:center;justify-content:flex-end;gap:5px;margin:3px 0 10px}
.mobile-chart-types button{font-size:10.5px;color:#798aa9;padding:6px 10px;border:1px solid #e5ecf8;background:#fff;border-radius:8px}
.mobile-chart-types button.active{color:#276fe7;background:#eaf3ff;border-color:#cfe1ff;font-weight:720}
.chart-mode button{min-width:31px;min-height:28px}
.chart-table-scroll{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.chart-table-scroll .table-data{min-width:max-content}
.chart-table-scroll .table-data th,.chart-table-scroll .table-data td{padding:9px 11px;white-space:nowrap}
.chart-download{display:none!important}


/* A chart result should be full-bleed inside the phone content area rather than
   permanently indented behind the AI avatar. The avatar remains beside the
   short text answer, while charts/actions/follow-ups span both grid columns. */
.chat-scroll{padding:8px 8px 24px}
.answer-row.mobile-result-row{
  display:grid;
  grid-template-columns:32px minmax(0,1fr);
  column-gap:8px;
  row-gap:0;
  align-items:start;
  width:100%;
  min-width:0;
}
.mobile-result-row>.ai-avatar{grid-column:1;grid-row:1}
.mobile-result-row>.answer{display:contents}
.mobile-result-row .answer-top{
  grid-column:2;grid-row:1;min-width:0;
  padding:12px 13px;
}
.mobile-result-row .chart-card,
.mobile-result-row .toolbar,
.mobile-result-row .followups{
  grid-column:1 / -1;
  width:100%;
  min-width:0;
}
.mobile-result-row .chart-card{
  padding:12px 8px 11px;
  margin-top:11px;
  border-radius:16px;
  box-shadow:0 5px 18px rgba(66,87,162,.065);
}
.mobile-result-row .chart-plot{
  margin:2px 0 0;
  padding:6px 2px 10px;
  border-radius:12px;
}
.mobile-result-row .chart-head{margin-bottom:8px}
.mobile-result-row .chart-svg{width:100%;max-width:100%}
.mobile-result-row .mobile-chart-types{margin-bottom:9px}
.mobile-result-row .toolbar{margin-top:10px}
.mobile-result-row .followups{margin-top:11px}
@media (max-width:370px){
  .chat-scroll{padding-left:6px;padding-right:6px}
  .mobile-result-row .chart-card{padding-left:6px;padding-right:6px}
}


/* A fixed-height viewport for every chart type and the data table.
   Switching bar/line/pie/table never grows or shrinks the chat result card.
   Long rankings scroll INSIDE this surface instead of pushing the composer. */
.mobile-result-row .chart-viewport{
  height: 400px;
  height: clamp(280px, 45dvh, 440px);
  min-height: 0;
  max-height: none;
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: #c5d5f1 transparent;
  border: 1px solid #e7eefb;
  background: #fcfdff;
  border-radius: 12px;
  padding: 7px 3px 8px;
}
.mobile-result-row .chart-viewport:focus-visible{
  outline: 2px solid #8db7ff;
  outline-offset: 2px;
}
.mobile-result-row .chart-viewport::-webkit-scrollbar{width:4px}
.mobile-result-row .chart-viewport::-webkit-scrollbar-thumb{
  background:#c5d5f1;border-radius:5px
}
.mobile-result-row .chart-viewport .chart-plot{
  padding:0;
  margin:0;
  border:0;
  border-radius:0;
  background:transparent;
  width:100%;
  max-width:100%;
  min-height:0;
  overflow:visible;
}
.mobile-result-row .chart-viewport .chart-svg{
  display:block;
  width:100%;
  height:auto;
  max-width:100%;
}
.mobile-result-row .chart-viewport .chart-table-scroll{
  width:100%;
  height:auto;
  max-height:none;
  overflow-x:auto;
  overflow-y:visible;
  border:0;
}
.mobile-result-row .chart-viewport .chart-footnote{
  margin:6px 8px 2px;
  color:#899bb5;
}


/* Asking for a specific metric is an interactive clarification, not a dead end. */
.clarify-followups {
  background:#f6faff;border:1px solid #dbe8ff;
  border-radius:14px;padding:12px 11px;margin:13px 0 5px;
}
.clarify-followups .follow-label {
  margin:0 0 5px;color:#305d9b;font-weight:760;font-size:13px;
}
.clarify-followups .clarify-help {
  margin:0 0 12px;color:#7489aa;font-size:11px;line-height:1.65;
}
.clarify-followups .chips {
  display:flex;flex-direction:column;align-items:stretch;gap:8px;
}
.clarify-followups .chip {
  display:flex;justify-content:space-between;align-items:center;
  width:100%;border:1px solid #caddfc;
  border-radius:10px;padding:10px 12px;
  min-height:41px;background:#fff;color:#2f75dc;
  text-align:left;font-size:12px;line-height:1.5;
}

e)" opacity=".91"/><rect x="28" y="171" width="8" height="15" rx="3" fill="#dcecff"/><rect x="42" y="161" width="8" height="25" rx="3" fill="#dcecff"/><rect x="56" y="151" width="8" height="35" rx="3" fill="#dcecff"/><path d="m194 36 4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#fff" opacity=".92"/></svg>`;

async function api(path,method='GET',body){
 const token=sessionStorage.getItem('dataask_token');
 const resp=await fetch(path,{method,headers:{'Accept':'application/json',...(body?{'Content-Type':'application/json'}:{}),...(token?{'Authorization':'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});
 const raw=await resp.text();let data={};try{data=raw?JSON.parse(raw):{}}catch{data={message:raw.slice(0,200)}}
 if(!resp.ok){if(resp.status===401){state.loggedIn=false;sessionStorage.removeItem('dataask_token');state.modal={type:'login'}}throw Error(data.message||('请求失败 HTTP '+resp.status))}
 return data;
}

async function bootstrap(){
 if(!state.loggedIn){state.modal={type:'login'};render();return}
 try{const data=await api('/api/mini/bootstrap');state.profile=data.user;state.modal=null;state.loggedIn=true;render();await Promise.all([loadHistory(false),loadCharts(false)])}
 catch(e){state.modal={type:'login'};state.loggedIn=false;render()}
}

async function login(){
 const username=document.getElementById('login-user')?.value?.trim();
 const password=document.getElementById('login-pass')?.value;
 if(!username||!password){showToast('请输入账号和密码');return}
 try{const data=await api('/api/auth/login','POST',{username,password});sessionStorage.setItem('dataask_token',data.token);state.loggedIn=true;state.profile={username:data.username,display_name:data.displayName,role:data.role};state.modal=null;render();await bootstrap();showToast('登录成功')}
 catch(e){showToast(e.message)}
}

function logout(){
 sessionStorage.removeItem('dataask_token');state.loggedIn=false;state.profile=null;state.sessionId=null;state.lastMessageId=null;state.chat=[];state.charts=[];state.sessions=[];state.modal={type:'login'};state.view='home';render();
}

async function loadHistory(redraw=true){
 try{state.sessions=await api('/api/chat/sessions');if(redraw)render()}catch(e){showToast(e.message)}
}

async function loadCharts(redraw=true){
 try{state.charts=await api('/api/mini/charts?view=mine');state.shared=await api('/api/mini/charts?view=shared');if(redraw)render()}catch(e){showToast(e.message)}
}

function querySummary(a){
 if(a.unsupported)return safe(a.summary||'当前问题不支持，请找管理员“许愿”');
 return safe(a.summary||'已返回真实查询结果');
}


const chartColors=['#3478ec','#12b8a6','#f49b4e','#8467d8','#e86992','#24a6cf','#dbc34d','#62bc80'];
const cnLabels={city:'城市',city_name:'城市',city_name_std:'城市',province:'省份',dt:'业务日期',biz_date:'业务日期',total_orders:'订单总数',order_cnt:'订单量',order_count:'订单数',total_amount:'总金额',pay_amount:'实付金额',total_revenue:'营业额',revenue:'营业额',user_cnt:'用户数',store_name:'门店名称'};
function colLabel(a,c){return a.columnLabels?.[c]||cnLabels[String(c).toLowerCase()]||c}
function valueFmt(n){return Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:2})}
function chartCols(a){
 const cols=a.columns||[],rows=a.rows||[];
 const nums=cols.filter(c=>rows.some(r=>r[c]!==null&&r[c]!==undefined&&r[c]!==''&&typeof r[c]!=='boolean'&&Number.isFinite(Number(r[c]))));
 const measures=nums.filter(c=>/count|cnt|amount|orders|revenue|total|sum|num|income|sales|金额|收入|数量|订单/i.test(c));
 const y=measures[0]||nums[nums.length-1],x=cols.find(c=>c!==y&&rows.some(r=>r[c]!=null&&!Number.isFinite(Number(r[c]))))||cols.find(c=>c!==y);
 return {x,y};
}
function chartable(a){const {x,y}=chartCols(a);return !!(x&&y&&(a.rows||[]).length>1)}
function pieAllowed(a){
 if(!chartable(a))return false;const {y}=chartCols(a),v=(a.rows||[]).slice(0,12).map(r=>Number(r[y]));
 return v.every(n=>Number.isFinite(n)&&n>=0)&&v.some(n=>n>0);
}
function displayType(a){
 const type=state.chartStyles[a.id]||(['bar','line','pie'].includes(a.chartType)?a.chartType:'bar');
 return type==='pie'&&!pieAllowed(a)?'bar':type;
}
function displayMode(a){return state.chartModes[a.id]||(!chartable(a)?'table':'chart')}
function resultTable(a){
 const cols=a.columns||[],rows=a.rows||[];
 if(!cols.length)return '<p class="inner-desc">暂无数据</p>';
 return '<div class="chart-table-scroll"><table class="table-data"><thead><tr>'+
 cols.map(c=>'<th>'+safe(colLabel(a,c))+'</th>').join('')+'</tr></thead><tbody>'+
 rows.slice(0,200).map(r=>'<tr>'+cols.map(c=>'<td>'+safe(r[c]??'—')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}
function resultChart(a){
 if(!chartable(a))return resultTable(a);
 const {x,y}=chartCols(a),type=displayType(a);
 const all=a.rows||[],rows=all.slice(0,type==='pie'?12:60),nums=rows.map(r=>Number(r[y])||0);
 const W=340,svgLabel=safe(colLabel(a,x))+' / '+safe(colLabel(a,y));
 let svg='',H=220;
 if(type==='bar'){
   const left=77,right=42,top=26,rowH=31,barH=14,inner=W-left-right;
   H=top+rows.length*rowH+25;
   const min=Math.min(0,...nums),max=Math.max(0,...nums),range=max-min||1;
   const zero=left+(0-min)/range*inner;
   svg=[0,.25,.5,.75,1].map(t=>{
     const xx=left+t*inner;
     return '<line x1="'+xx.toFixed(1)+'" y1="13" x2="'+xx.toFixed(1)+'" y2="'+(H-29)+'" stroke="#e6eefa" stroke-dasharray="3 4"/>'+
       '<text x="'+xx.toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="9" fill="#91a0b8">'+safe(valueFmt(min+t*range))+'</text>';
   }).join('');
   svg+=rows.map((r,i)=>{
     const val=nums[i],end=left+(val-min)/range*inner,xx=Math.min(zero,end),barWidth=Math.max(1,Math.abs(end-zero)),yy=top+i*rowH;
     const name=String(r[x]??'未分类');
     return '<text x="'+(left-8)+'" y="'+(yy+10)+'" text-anchor="end" font-size="10.5" fill="#526784">'+safe(name.length>8?name.slice(0,8)+'…':name)+'</text>'+
       '<rect x="'+xx.toFixed(1)+'" y="'+yy+'" width="'+barWidth.toFixed(1)+'" height="'+barH+'" rx="3" fill="'+chartColors[i%chartColors.length]+'"/>'+
       '<text x="'+(val>=0?Math.min(end+5,W-3):Math.max(end-4,3)).toFixed(1)+'" y="'+(yy+10)+'" text-anchor="'+(val>=0?'start':'end')+'" font-size="9.5" font-weight="600" fill="#526784">'+safe(valueFmt(val))+'</text>';
   }).join('');
 }else if(type==='line'){
   const left=41,right=13,top=18,bottom=43,lo=Math.min(0,...nums),hi=Math.max(0,...nums),range=hi-lo||1;
   const xp=i=>left+(W-left-right)*i/Math.max(1,rows.length-1);
   const yp=n=>top+(H-top-bottom)*(hi-n)/range;
   svg=[0,.25,.5,.75,1].map(t=>{const n=lo+range*t,yy=yp(n);return '<line x1="'+left+'" y1="'+yy.toFixed(1)+'" x2="'+(W-right)+'" y2="'+yy.toFixed(1)+'" stroke="#e6eefa" stroke-dasharray="3 4"/><text x="'+(left-5)+'" y="'+(yy+3).toFixed(1)+'" text-anchor="end" font-size="9" fill="#91a0b8">'+safe(valueFmt(n))+'</text>'}).join('');
   svg+='<path d="'+nums.map((v,i)=>(i?'L':'M')+xp(i).toFixed(1)+' '+yp(v).toFixed(1)).join(' ')+'" stroke="#3478ec" stroke-width="2.7" fill="none" stroke-linejoin="round"/>';
   svg+=nums.map((v,i)=>'<circle cx="'+xp(i).toFixed(1)+'" cy="'+yp(v).toFixed(1)+'" r="2.8" fill="#fff" stroke="#3478ec" stroke-width="1.7"/>').join('');
   const ticks=[...new Set([0,Math.round((rows.length-1)/4),Math.round((rows.length-1)/2),Math.round(3*(rows.length-1)/4),rows.length-1])];
   svg+=ticks.map(i=>'<text x="'+xp(i).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle" font-size="9" fill="#8b9ab3">'+safe(String(rows[i][x]??'').slice(0,6))+'</text>').join('');
 }else{
   const total=nums.reduce((u,v)=>u+v,0),cx=170,cy=94,r=78,firstY=204;
   H=firstY+rows.length*21+10;let angle=-Math.PI/2;
   svg=rows.map((row,i)=>{
     const v=nums[i];if(v<=0)return '';
     const next=angle+v/total*Math.PI*2,dx=cx+r*Math.cos(angle),dy=cy+r*Math.sin(angle),ex=cx+r*Math.cos(next),ey=cy+r*Math.sin(next);
     const sweep=next-angle,large=sweep>Math.PI?1:0;
     let d=sweep>2*Math.PI-.00001?'M '+cx+' '+(cy-r)+' A '+r+' '+r+' 0 1 1 '+(cx-.01)+' '+(cy-r)+' A '+r+' '+r+' 0 1 1 '+cx+' '+(cy-r):
       'M '+cx+' '+cy+' L '+dx.toFixed(2)+' '+dy.toFixed(2)+' A '+r+' '+r+' 0 '+large+' 1 '+ex.toFixed(2)+' '+ey.toFixed(2)+' Z';
     angle=next;
     return '<path d="'+d+'" fill="'+chartColors[i%chartColors.length]+'" stroke="white" stroke-width="2"/>';
   }).join('');
   svg+='<circle cx="'+cx+'" cy="'+cy+'" r="39" fill="white"/><text x="'+cx+'" y="'+(cy-5)+'" text-anchor="middle" font-size="10" fill="#91a0b8">合计</text><text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" font-size="17" font-weight="750" fill="#263e63">'+safe(valueFmt(total))+'</text>';
   svg+=rows.map((row,i)=>'<rect x="12" y="'+(firstY+i*21-10)+'" width="10" height="10" rx="3" fill="'+chartColors[i%chartColors.length]+'"/>'+
     '<text x="31" y="'+(firstY+i*21)+'" font-size="11" fill="#526784">'+safe(String(row[x]??'未分类').slice(0,14))+'</text>'+
     '<text x="326" y="'+(firstY+i*21)+'" font-size="10.5" text-anchor="end" fill="#526784">'+safe(valueFmt(nums[i]))+' · '+(nums[i]/total*100).toFixed(1)+'%</text>').join('');
 }
 return '<div class="chart-plot" role="img" aria-label="'+svgLabel+'图表"><svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMin meet">'+svg+'</svg>'+
 '<p class="chart-footnote">'+svgLabel+(all.length>rows.length?' · 仅展示前'+rows.length+'项':'')+'</p></div>';
}

function answerCard(item){
 if(item.pending)return '<div class="answer-row"><div class="ai-avatar">'+logo()+'</div><div class="answer"><div class="answer-top"><div class="date-line">正在分析真实业务数据…</div></div></div></div>';

 const data=item.answer||{},single=data.rows?.length===1&&data.columns?.length===1;

 const saved=state.charts.some(c=>c.sourceMessageId===data.id);
 const summary=String(data.summary||'').trim();
 const generic=/^(已从\s*StarRocks|已查询到|查询到|已返回|已获取|数据查询成功|本次查询返回)/i.test(summary)&&
   /(\d+\s*行|条数据|真实数据|查询结果|点击下方|继续分析|来自)/.test(summary);
 const analysis=(!data.rows?.length||data.unsupported||!generic)?'<div class="comparison">'+querySummary(data)+'</div>':'';
 const visual=!data.unsupported&&!!data.rows?.length;

   (canPlot?'<button aria-label="图表" class="'+(view==='chart'?'active':'')+'" data-action="chart-mode" data-mode="chart" data-mid="'+safe(data.id)+'">'+icon('chart')+'</button>':'')+

 // Keep the type switch row present in both chart and table modes so the card's outer height never jumps.
 const chartTypes=canPlot?'<div class="mobile-chart-types">'+

 return '<div class="answer-row'+(visual?' mobile-result-row':'')+'"><div class="ai-avatar">'+logo()+'</div><div class="answer">'+
 '<div class="answer-top"><div class="date-line">'+safe(data.title||'数据查询')+'</div>'+
 (single&&!data.unsupported?'<div class="main-number">'+safe(value??'—')+'</div>':'')+
 analysis+(data.timeLabel?'<div class="sample-note">'+safe(data.timeLabel)+'</div>':'')+'</div>'+
 (visual?'<div class="chart-card"><div class="chart-head"><div class="chart-title">'+safe(data.metricLabel||'业务分析')+'</div>'+
 '<div class="chart-actions">'+views+'</div></div>'+chartTypes+
 '<div class="chart-viewport" tabindex="0" role="region" aria-label="数据图表与表格区域，可上下滚动">'+
 (view==='table'?resultTable(data):resultChart(data))+'</div></div>'+
 '<div class="toolbar"><button class="lite-btn '+(saved?'saved':'')+'" data-action="save" data-mid="'+safe(data.id)+'">'+icon('star','sm')+(saved?'已收藏':'收藏图表')+'</button>'+
 '<button class="lite-btn" data-action="share" data-mid="'+safe(data.id)+'">'+icon('share','sm')+'共享</button></div>':'')+
 (data.followUps?.length?'<div class="followups '+(data.unsupported?'clarify-followups':'')+'"><div class="follow-label">'+(data.unsupported?'你想查看哪项指标？':'你还可以继续问：')+'</div>'+
 (data.unsupported?'<p class="clarify-help">选择一个具体指标继续查询，或在输入框补充说明：</p>':'')+
 '<div class="chips">'+data.followUps.map(q=>'<button class="chip" data-action="follow" data-mid="'+safe(data.id)+'" data-q="'+safe(q)+'">'+icon('sparkle','sm')+safe(q)+'</button>').join('')+'</div></div>':'')+
 '</div></div>';
}

function render(){

 root.innerHTML='<div class="device"><div class="screen">'+statusBar()+header()+'<main class="content" id="scroll-area">'+(state.view==='home'?homePage():state.view==='chat'?chatPage():state.view==='history'?historyPage():state.view==='charts'?chartsPage():state.view==='chart-detail'?chartDetailPage():profilePage())+'</main>'+(state.view==='chat'?composer():nav())+modal()+(state.toast?'<div class="toast">'+safe(state.toast)+'</div>':'')+'</div></div>';
 if(state.scrollBottom){const el=document.getElementById('scroll-area');if(el)el.scrollTop=el.scrollHeight;state.scrollBottom=false}

function showToast(str){state.toast=str;render();clearTimeout(showToast.t);showToast.t=setTimeout(()=>{state.toast='';render()},2600)}

async function openChat(q){state.view='chat';state.chat=[];state.sessionId=null;state.lastMessageId=null;state.chartMode='chart';await askText(q,false)}

async function followChat(q, sourceId){await askText(q,true,sourceId)}

async function askText(question,follow,sourceId){
 const q=String(question||'').trim();if(!q){showToast('请输入业务问题');return}if(!state.loggedIn){state.modal={type:'login'};render();return}
 if(state.loading)return;
 if(!follow){state.chat=[];state.sessionId=null;state.lastMessageId=null;state.chartMode='chart'}
 state.view='chat';state.chat.push({type:'user',text:q});const pending={type:'answer',pending:true};state.chat.push(pending);state.loading=true;state.scrollBottom=true;render();
 try {
  const body={question:q,sessionId:state.sessionId,sourceMessageId:follow?(sourceId||state.lastMessageId):null};
  const answer=await api('/api/chat/ask','POST',body);
  state.sessionId=answer.sessionId;state.lastMessageId=answer.id;Object.assign(pending,{pending:false,answer});await loadHistory(false);
 }catch(e){Object.assign(pending,{pending:false,error:e.message})}finally{state.loading=false;state.scrollBottom=true;render()}
}

function ask(inputId,follow){const val=document.getElementById(inputId)?.value;askText(val,follow)}

async function openSession(id){
 try{const answers=await api('/api/chat/sessions/'+encodeURIComponent(id)+'/messages');state.chat=[];state.sessionId=id;state.chartMode='chart';for(const a of answers){state.chat.push({type:'user',text:a.question},{type:'answer',answer:a});state.lastMessageId=a.id}state.view='chat';render()}
 catch(e){showToast(e.message)}
}

async function saveAnswer(id){
 if(!id)return null;
 const current=state.charts.find(c=>c.sourceMessageId===id);if(current)return current;
 const item=state.chat.find(i=>i.answer?.id===id);if(!item){showToast('找不到问数结果');return null}
 try{const chart=await api('/api/mini/charts','POST',{sourceMessageId:id,title:item.answer.title});await loadCharts(false);showToast('已收藏至我的图表');return chart}catch(e){showToast(e.message);return null}
}

async function openSaved(id){try{const c=await api('/api/mini/charts/'+encodeURIComponent(id));await openChat(c.question)}catch(e){showToast(e.message)}}

async function removeChart(id){if(!window.confirm('确定取消收藏这个图表吗？'))return;try{await api('/api/mini/charts/'+encodeURIComponent(id),'DELETE');await loadCharts();showToast('已取消收藏')}catch(e){showToast(e.message)}}

async function removeSession(id){if(!window.confirm('删除此会话及其消息吗？'))return;try{await api('/api/mini/sessions/'+encodeURIComponent(id),'DELETE');await loadHistory();showToast('会话已删除')}catch(e){showToast(e.message)}}

function openModal(type,id=''){state.modal={type,id};state.shareScope='PRIVATE';state.sharePerson='';render()}

async function applyShare(){
 let id=state.modal?.id;if(!id){showToast('请先收藏图表');return}
 const users=state.shareScope==='SELECTED'?String(document.getElementById('share-member')?.value||'').split(/[，,]/).map(s=>s.trim()).filter(Boolean):[];
 try{await api('/api/mini/charts/'+encodeURIComponent(id)+'/share','PUT',{scope:state.shareScope,users});state.modal=null;await loadCharts();showToast('共享权限已保存')}catch(e){showToast(e.message)}
}

async function handleClick(e){
 const target=e.target.closest('[data-action]');if(!target)return;const a=target.dataset.action;
 switch(a){
 case 'tab':state.view=target.dataset.view;state.tab=state.view;state.modal=null;render();if(state.view==='history')loadHistory();if(state.view==='charts')loadCharts();break;
 case 'back':state.view=state.view==='chart-detail'?'charts':'home';state.chartDetail=null;render();break;
 case 'question':openChat(target.dataset.q);break;
 case 'follow':followChat(target.dataset.q,target.dataset.mid);break;
 case 'ask-home':ask('home-query',false);break;
 case 'ask-chat':ask('chat-query',true);break;
 case 'shuffle':state.sampleSet=(state.sampleSet+1)%sets.length;render();break;
 case 'chart-mode':{
   const scroll=document.getElementById('scroll-area')?.scrollTop||0;
   state.chartModes[target.dataset.mid]=target.dataset.mode;
   render();
   const area=document.getElementById('scroll-area');if(area)area.scrollTop=scroll;
   break;
 }
 case 'chart-style':{
   const scroll=document.getElementById('scroll-area')?.scrollTop||0;
   state.chartStyles[target.dataset.mid]=target.dataset.style;
   state.chartModes[target.dataset.mid]='chart';
   render();
   const area=document.getElementById('scroll-area');if(area)area.scrollTop=scroll;
   break;
 }
 case 'save':await saveAnswer(target.dataset.mid);break;
 case 'share':{let id=target.dataset.chart;if(!id&&target.dataset.mid){const chart=await saveAnswer(target.dataset.mid);id=chart?.id}if(id)openModal('share',id);break}
 case 'open-share':state.view='charts';render();loadCharts();break;
 case 'scope':state.shareScope=target.dataset.scope;render();break;
 case 'apply-share':await applyShare();break;
 case 'session':openSession(target.dataset.id);break;
 case 'remove-session':removeSession(target.dataset.id);break;
 case 'open-chart':openSaved(target.dataset.id);break;
 case 'chart-refresh':refreshSaved(target.dataset.id);break;
 case 'remove-chart':removeChart(target.dataset.id);break;
 case 'login':await login();break;
 case 'logout':logout();break;
 case 'about':case 'more':openModal('about');break;
 case 'close':if(state.modal?.type!=='login'){state.modal=null;render()}break;
 case 'close-overlay':if(e.target===target&&state.modal?.type!=='login'){state.modal=null;render()}break;
 }
}

function startApp(){
 document.addEventListener('click',handleClick);
 document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='home-query'){e.preventDefault();ask('home-query',false)}else if(e.key==='Enter'&&e.target.id==='chat-query'){e.preventDefault();ask('chat-query',true)}else if(e.key==='Enter'&&['login-user','login-pass'].includes(e.target.id)){e.preventDefault();login()}else if(e.key==='Escape'&&state.modal?.type!=='login'){state.modal=null;render()}});
 document.addEventListener('input',e=>{if(e.target.id==='history-search'){state.historySearch=e.target.value;const sel=e.target.selectionStart;render();const next=document.getElementById('history-search');if(next){next.focus();next.setSelectionRange(sel,sel)}}else if(e.target.id==='share-member'){state.sharePerson=e.target.value}});
 render();bootstrap();
}
startApp();
})();
</script>
</body>
</html>
