server:
  port: ${DATAASK_PORT:8087}
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DATAASK_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/dataask?useUnicode=true&characterEncoding=utf8}
    username: ${DATAASK_MYSQL_USER:dataask}
    password: ${DATAASK_MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8
  sql:
    init:
      mode: always
dataask:
  jwt-secret: ${DATAASK_JWT_SECRET:}
  admin-password: ${DATAASK_ADMIN_PASSWORD:}
  starrocks:
    jdbc-url: ${DATAASK_STARROCKS_JDBC_URL:}
    username: ${DATAASK_STARROCKS_USER:}
    password: ${DATAASK_STARROCKS_PASSWORD:}
    schema: ${DATAASK_STARROCKS_SCHEMA:ads}
  ai:
    base-url: ${DATAASK_AI_BASE_URL:https://api.deepseek.com}
    api-key: ${DATAASK_AI_API_KEY:}
    model: ${DATAASK_AI_MODEL:deepseek-flash}
