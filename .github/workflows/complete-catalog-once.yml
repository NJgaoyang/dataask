name: complete-catalog-once
on:
  push:
    branches: [fix/web-config-catalog-20261109]
    paths: [.github/workflows/complete-catalog-once.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'NJgaoyang/dataask' && github.ref == 'refs/heads/fix/web-config-catalog-20261109'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact, baseline-checked edits
        run: |
          python3 .github/scripts/complete-catalog.py
          git diff --check
      - name: Compile frontend and verify backend
        run: mvn -B clean verify
      - name: Commit verified source edits and remove one-time runner
        run: |
          rm .github/scripts/complete-catalog.py .github/workflows/complete-catalog-once.yml
          git add package.sh pom.xml scripts src web .github/scripts/complete-catalog.py .github/workflows/complete-catalog-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: integrate MySQL configuration workspace and version-verified full-stack packaging'
          git push origin HEAD:refs/heads/fix/web-config-catalog-20261109
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
