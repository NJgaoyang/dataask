name: build-java21-web
on:
  push:
    branches: [main, dev20261109-miniapp-v2]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check miniapp JavaScript syntax and live API integration
        run: node scripts/verify-miniapp-js.mjs
      - name: Verify approved PC workbench layout
        run: node scripts/verify-pc-home.mjs
      - name: Build H5
        run: |
          cd web
          npm install --no-audit --no-fund
          npm run build
      - name: Verify Java
        run: mvn -B clean verify
      - name: Package distribution and verify embedded frontend version
        run: |
          bash scripts/package.sh
          unzip -p target/dataask-0.1.0-SNAPSHOT.jar BOOT-INF/classes/static/build-info.json | grep -F 'desktop-bluewhite-account-v5'
          unzip -p target/dataask-0.1.0-SNAPSHOT.jar BOOT-INF/classes/static/miniapp/index.html | grep -F '/api/mini/bootstrap'
          tar -tzf release/dataask-0.1.0.tar.gz | grep -F 'dataask-0.1.0/bin/upgrade.sh'

      - name: Upload standalone Linux release
        uses: actions/upload-artifact@v4
        with:
          name: dataask-miniapp-v2-linux-tar
          path: release/dataask-0.1.0.tar.gz
          if-no-files-found: error
          retention-days: 14
