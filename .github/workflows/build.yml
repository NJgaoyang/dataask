name: build-java21-web
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build H5
        run: |
          cd web
          npm install --no-audit --no-fund
          npm run build
      - name: Verify Java
        run: mvn -B clean verify
