name: build-java21-web
on:
  push:
    branches: [main, dev20261109-miniapp-v2]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check miniapp JavaScript syntax and live API integration
        run: node scripts/verify-miniapp-js.mjs
      - name: Verify approved PC workbench layout
        run: node scripts/verify-pc-home.mjs
      - name: Build H5
        run: |
          cd web
          npm install --no-audit --no-fund
          npm run build
      - name: Browser smoke test for seven admin modules
        run: |
          cd web
          npm install --no-save --no-package-lock --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/dataask-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/admin-ui-smoke.mjs
      - name: Browser smoke test for saved chart PC and miniapp
        run: |
          cd web
          node scripts/chart-ui-smoke.mjs
      - name: Upload chart detail screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataask-saved-chart-pc-mobile
          path: |
            web/artifacts/chart-detail-pc.png
            web/artifacts/chart-detail-mobile.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload UI smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataask-admin-desktop-smoke
          path: |
            web/artifacts/admin-desktop.png
            web/artifacts/admin-desktop-failure.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify Java
        run: mvn -B clean verify
      - name: Package distribution and verify embedded frontend version
        run: |
          bash scripts/package.sh
          unzip -p target/dataask-0.1.0-SNAPSHOT.jar BOOT-INF/classes/static/build-info.json | grep -F 'desktop-chart-studio-v9'
          unzip -p target/dataask-0.1.0-SNAPSHOT.jar BOOT-INF/classes/static/miniapp/index.html | grep -F '/api/mini/bootstrap'
          tar -tzf release/dataask-0.1.0.tar.gz | grep -F 'dataask-0.1.0/bin/upgrade.sh'

      - name: Upload standalone Linux release
        uses: actions/upload-artifact@v4
        with:
          name: dataask-miniapp-v2-linux-tar
          path: release/dataask-0.1.0.tar.gz
          if-no-files-found: error
          retention-days: 14
