name: build-java21-web
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record tested source
        run: git archive --format=tar.gz HEAD > /tmp/dataask-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dataask-source
          path: /tmp/dataask-source.tar.gz
          retention-days: 7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build H5
        run: |
          cd web
          npm install --no-audit --no-fund
          npm run build
      - name: Verify Java
        run: mvn -B clean verify
      - name: Package distribution and verify embedded frontend version
        run: |
          bash scripts/package.sh
          unzip -p target/dataask-0.1.0-SNAPSHOT.jar BOOT-INF/classes/static/build-info.json | grep -F 'desktop-three-pane'
          tar -tzf release/dataask-0.1.0.tar.gz | grep -F 'dataask-0.1.0/bin/upgrade.sh'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dataask-distribution
          path: release/dataask-0.1.0.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dataask-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
