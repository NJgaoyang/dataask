server:
  port: ${DATAASK_PORT:8087}
# DataAsk 部署模板，部署后填写真实参数并 chmod 600 conf/application.yml
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/dataask?useUnicode=true&characterEncoding=utf8
    username: dataask
    password: ""
dataask:
  admin-password: ""
  # 使用 openssl rand -hex 32 生成，至少32字节；修改后旧 token 将失效
  jwt-secret: ""
  starrocks:
    jdbc-url: ""
    username: ""
    password: ""
    schema: ads
  # AI 模型和 Embedding 模型可在系统管理的 Web 页面配置；
  # 以下仅为未通过 Web 保存时的默认示例，无需在这里填写 Key。
  ai:
    base-url: "https://api.deepseek.com"
    api-key: ""
    model: "deepseek-flash"
